- title: "Dr. Richards to Present at 2026 SDT Conference in Geneva"
  date: "July 2026"
  text: "Dr. Richards will be giving a talk at the 2026 Self-Determination Theory Conference in Geneva, Switzterland on our American Cancer Society funded study on using the theory to understand multiple health behavior change in the new year."

